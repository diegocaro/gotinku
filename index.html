<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>GoTinku — Encuentra qué hacer en Chile</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: system-ui, sans-serif; background: #f5f5f5; color: #1a1a1a; padding: 2rem 1rem; max-width: 1100px; margin: 0 auto; }
    footer { margin-top: 3rem; padding-top: 1rem; border-top: 1px solid #e0e0e0; font-size: 0.8rem; color: #999; text-align: center; }
    footer a { color: #888; text-decoration: none; }
    footer a:hover { text-decoration: underline; }

    .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 1.5rem; gap: 2rem; }
    .header-left { display: flex; align-items: baseline; gap: 0.8rem; }
    h1 { font-size: 1.8rem; margin: 0; }
    .subtitle { color: #666; font-size: 0.9rem; margin: 0; white-space: nowrap; }
    .updated { color: #999; font-size: 0.8rem; text-align: right; }
    .updated { color: #999; font-size: 0.8rem; }

    /* Controls */
    .controls { background: #fff; border-radius: 10px; padding: 1.5rem; margin-bottom: 2rem; box-shadow: 0 1px 4px rgba(0,0,0,.08); }
    .control-row { display: flex; flex-wrap: wrap; gap: 1rem; align-items: center; margin-bottom: 1rem; }
    .control-row:last-child { margin-bottom: 0; }

    label { font-weight: 600; font-size: 0.9rem; }
    select { padding: 0.5rem 0.75rem; border: 1px solid #e0e0e0; border-radius: 6px; font-size: 0.9rem; }
    input[type="text"] { padding: 0.5rem 0.75rem; border: 1px solid #e0e0e0; border-radius: 6px; font-size: 0.9rem; flex: 1; max-width: 300px; }

    /* Time window tabs - sticky at top */
    .time-window-section {
      position: sticky;
      top: 0;
      background: #fff;
      border-bottom: 2px solid #e0e0e0;
      border-radius: 10px;
      padding: 0.6rem 1.5rem;
      margin-top: -1.5rem;
      margin-bottom: 2rem;
      z-index: 10;
      box-shadow: none;
      display: flex;
      align-items: center;
      gap: 1.5rem;
      justify-content: space-between;
    }
    .time-window-search { flex: 0 0 280px; position: relative; display: flex; align-items: center; }
    .time-window-search input { width: 100%; padding: 0.45rem 36px 0.45rem 0.75rem; border: 1px solid #d0d0d0; border-radius: 6px; font-size: 0.9rem; height: 36px; }
    .search-button { position: absolute; right: 4px; top: 50%; transform: translateY(-50%); background: none; border: none; cursor: pointer; font-size: 1rem; padding: 0.4rem; color: #888; transition: all 0.2s; }
    .search-button:hover { color: #555; }
    .time-tabs { display: flex; flex-wrap: wrap; gap: 0.5rem; justify-content: flex-end; flex: 1; align-items: center; }
    .time-tab {
      padding: 0.5rem 1rem;
      background: #f0f0f0;
      border: 2px solid transparent;
      border-radius: 20px;
      cursor: pointer;
      font-weight: 600;
      font-size: 0.85rem;
      transition: all 0.2s;
      color: #555;
      white-space: nowrap;
      height: 36px;
      display: flex;
      align-items: center;
    }
    .time-tab.active {
      background: #0057ff;
      color: #fff;
      border-color: #0057ff;
    }
    .time-tab:hover:not(.active) { background: #e0e0e0; }
    .time-tab.active:hover { background: #0047cc; }

    /* Category pills */
    .categories { display: flex; flex-wrap: wrap; gap: 0.5rem; }
    .category-pill { padding: 0.4rem 0.8rem; background: #f0f0f0; border: 1px solid #e0e0e0; border-radius: 20px; cursor: pointer; font-size: 0.85rem; transition: all 0.2s; }
    .category-pill:hover { background: #e0e0e0; }
    .category-pill.active { background: #0057ff; color: #fff; border-color: #0057ff; }

    /* Events grid */
    section { margin-bottom: 2.5rem; }
    h2 { font-size: 1.2rem; font-weight: 700; border-bottom: 2px solid #e0e0e0; padding-bottom: 0.5rem; margin-bottom: 1rem; }
    .count { font-weight: 400; color: #888; font-size: 1rem; }
    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 1rem; }

    .card { background: #fff; border-radius: 10px; padding: 1rem; box-shadow: 0 1px 4px rgba(0,0,0,.08); display: flex; flex-direction: column; gap: 0.4rem; position: relative; }
    .card-footer { display: flex; justify-content: space-between; align-items: center; margin-top: auto; }
    .card-header { display: flex; justify-content: space-between; align-items: center; }
    .city { font-size: 0.75rem; font-weight: 600; text-transform: uppercase; color: #888; }
    .date { font-size: 0.8rem; color: #555; }
    a.name { font-size: 1rem; font-weight: 600; color: #1a1a1a; text-decoration: none; }
    a.name:hover { text-decoration: underline; color: #0057ff; }
    .category { font-size: 0.75rem; font-weight: 600; color: #0057ff; text-transform: uppercase; letter-spacing: 0.5px; margin-top: 0.25rem; }
    .meta { font-size: 0.82rem; color: #555; }
    .price { color: #2a7a2a; font-weight: 500; }
    .confidence { font-size: 0.7rem; color: #888; text-align: right; margin-top: auto; margin-left: auto; }
    .empty { color: #999; font-style: italic; font-size: 0.9rem; padding: 2rem 0; text-align: center; }
    .sources { font-size: 0.75rem; color: #888; }

    .card.past-event { opacity: 0.5; pointer-events: none; }
    .card.past-event a.name { color: #999; }

    /* Loading state */
    .loading { text-align: center; padding: 3rem 1rem; font-size: 1.1rem; color: #666; }
    .error { background: #fee; border-radius: 10px; padding: 1.5rem; color: #c00; margin-bottom: 2rem; }
    .ai-disclaimer { background: #fff9e6; border-left: 4px solid #ff9800; padding: 1rem 1.5rem; margin-bottom: 2rem; border-radius: 6px; font-size: 0.9rem; color: #666; display: flex; align-items: center; gap: 1rem; }
    .ai-disclaimer strong { color: #333; }

    @media (max-width: 768px) {
      body { padding: 1.5rem 1rem; }
      h1 { font-size: 1.4rem; }
      .header { flex-direction: column; align-items: flex-start; margin-bottom: 2rem; }
      .header-left { flex-direction: column; gap: 0.25rem; }
      .subtitle { white-space: normal; }
      .updated { align-self: flex-start; margin-top: 0.5rem; }
      .time-window-section { flex-direction: column; align-items: stretch; gap: 1rem; }
      .time-window-search { flex: 1; }
      .time-tabs { justify-content: flex-start; }
      .control-row { flex-direction: column; align-items: stretch; }
      select, input[type="text"] { width: 100%; max-width: none; }
    }
  </style>
</head>
<body>
  <div class="header">
    <div class="header-left">
      <h1>GoTinku</h1>
      <p class="subtitle">Encuentra qué hacer en Chile</p>
    </div>
    <div class="updated" id="updated-info"></div>
  </div>

  <div class="ai-disclaimer">
    <span>⚠️</span>
    <span><strong>Generado con IA.</strong> Verifica los detalles del evento antes de asistir.</span>
  </div>

  <div id="main">
    <div class="loading">Cargando eventos...</div>
  </div>

  <footer>
    Hecho por <a href="https://github.com/diegocaro" target="_blank" rel="noopener">@diegocaro</a>
  </footer>

  <script>
    const state = {
      allEvents: [],
      timeWindow: 'esta_semana',
      selectedCities: [],
      selectedCategories: [],
      searchQuery: '',
      searchTimeout: null,
    };

    function syncStateToURL() {
      const params = new URLSearchParams();
      if (state.timeWindow && state.timeWindow !== 'esta_semana') {
        params.set('tw', state.timeWindow);
      }
      if (state.selectedCities.length > 0) {
        params.set('city', state.selectedCities[0]);
      }
      if (state.selectedCategories.length > 0) {
        params.set('cat', state.selectedCategories[0]);
      }
      if (state.searchQuery) {
        params.set('q', state.searchQuery);
      }
      const newURL = params.toString() ? `?${params.toString()}` : window.location.pathname;
      window.history.replaceState(null, '', newURL);
    }

    function loadStateFromURL() {
      const params = new URLSearchParams(window.location.search);
      if (params.has('tw')) {
        state.timeWindow = params.get('tw');
      }
      if (params.has('city')) {
        state.selectedCities = [params.get('city')];
      }
      if (params.has('cat')) {
        state.selectedCategories = [params.get('cat')];
      }
      if (params.has('q')) {
        state.searchQuery = params.get('q');
      }
    }

    function getToday() {
      return new Date();
    }

    function dateFromString(dateStr) {
      if (!dateStr) return null;
      const [y, m, d] = dateStr.split('-').map(Number);
      return new Date(y, m - 1, d);
    }

    function getThisSunday(today) {
      const day = today.getDay();
      const daysUntilSunday = day === 0 ? 0 : 7 - day;
      const sunday = new Date(today);
      sunday.setDate(today.getDate() + daysUntilSunday);
      return new Date(sunday.getFullYear(), sunday.getMonth(), sunday.getDate());
    }

    function getNextSunday(today) {
      const thisSunday = getThisSunday(today);
      const nextSunday = new Date(thisSunday);
      nextSunday.setDate(thisSunday.getDate() + 7);
      return nextSunday;
    }

    function getTimeWindows(event) {
      const today = getToday();
      const todayDate = new Date(today.getFullYear(), today.getMonth(), today.getDate());

      const dateStart = dateFromString(event.date_start);
      const dateEnd = dateFromString(event.date_end) || dateStart;

      if (!dateStart || !dateEnd) return [];

      const windows = [];

      // Hoy: today only
      if (dateStart <= todayDate && dateEnd >= todayDate) {
        windows.push('hoy');
      }

      // Esta semana: today to 7 days from now
      const sevenDaysFromToday = new Date(todayDate);
      sevenDaysFromToday.setDate(todayDate.getDate() + 6);
      if (dateEnd >= todayDate && dateStart <= sevenDaysFromToday) {
        windows.push('esta_semana');
      }

      // Este mes: today to 30 days from now
      const thirtyDaysFromToday = new Date(todayDate);
      thirtyDaysFromToday.setDate(todayDate.getDate() + 29);
      if (dateEnd >= todayDate && dateStart <= thirtyDaysFromToday) {
        windows.push('este_mes');
      }

      // Todos los días: any upcoming event
      if (dateEnd >= todayDate) {
        windows.push('proximos');
      }

      return windows;
    }

    function formatDate(dateStr) {
      if (!dateStr) return '';
      const months = ['ene', 'feb', 'mar', 'abr', 'may', 'jun', 'jul', 'ago', 'sep', 'oct', 'nov', 'dic'];
      const [y, m, d] = dateStr.split('-').map(Number);
      return `${d} ${months[m - 1]}`;
    }

    function formatDateRange(event) {
      const start = event.date_start;
      const end = event.date_end;
      if (end && end !== start) {
        return `${formatDate(start)} a ${formatDate(end)}`;
      }
      return formatDate(start);
    }

    function isPastEvent(event) {
      const today = new Date();
      const todayDate = new Date(today.getFullYear(), today.getMonth(), today.getDate());
      const eventEnd = dateFromString(event.date_end || event.date_start);
      return eventEnd && eventEnd < todayDate;
    }

    function renderCard(event) {
      const name = event.name || 'Sin nombre';
      const city = (event.city || '').toUpperCase();
      const category = event.category || '';
      const standardDate = formatDateRange(event);
      const dateText = event.date_text || '';
      const venue = event.venue || '';
      const location = event.location || '';
      const price = event.price || '';
      const postUrl = event.post_url || '';
      const confidence = event.confidence || 0;
      const postUrls = event.post_urls || [];

      const dateTooltip = dateText && !standardDate.toLowerCase().includes(dateText.toLowerCase())
        ? ` title="${dateText}"`
        : '';

      const venueLine = venue || location
        ? `<div class="meta">📍 ${venue}${venue && location ? ',' : ''} ${location}</div>`
        : '';
      const categoryLine = category ? `<div class="category">${category}</div>` : '';
      const priceLine = price ? `<div class="meta price">🎟 ${price}</div>` : '';
      const sourcesLine = postUrls && postUrls.length > 1
        ? `<div class="sources">${postUrls.length} fuentes</div>`
        : '<div></div>';

      const model = event.model || '-';
      const confidenceTooltip = `Información extraída por IA\nAutoevaluación: ${confidence}\nModelo: ${model}`;
      const isPast = isPastEvent(event);
      const cardClass = isPast ? 'card past-event' : 'card';

      return `
        <div class="${cardClass}">
          <div class="card-header">
            <span class="city">${city}</span>
            <span class="date"${dateTooltip}>${standardDate}</span>
          </div>
          <a class="name" href="${postUrl}" target="_blank" rel="noopener">${name}</a>
          ${categoryLine}
          ${venueLine}
          ${priceLine}
          <div class="card-footer">
            ${sourcesLine}
            <div class="confidence" title="${confidenceTooltip}">${Math.round(confidence * 100)}%</div>
          </div>
        </div>`;
    }

    function getFilteredEvents() {
      let filtered = state.allEvents.filter(event => {
        const windows = getTimeWindows(event);
        if (!windows.includes(state.timeWindow)) return false;

        if (state.selectedCities.length > 0 && !state.selectedCities.includes(event.city)) {
          return false;
        }

        if (state.selectedCategories.length > 0 && !state.selectedCategories.includes(event.category)) {
          return false;
        }

        if (state.searchQuery) {
          const words = state.searchQuery.toLowerCase().trim().split(/\s+/);
          const text = `${(event.name || '')} ${(event.venue || '')} ${(event.location || '')}`.toLowerCase();
          const matchesAll = words.every(word => text.includes(word));
          if (!matchesAll) return false;
        }

        return true;
      });

      const today = getToday();
      const todayDate = new Date(today.getFullYear(), today.getMonth(), today.getDate());

      filtered.sort((a, b) => {
        const aStart = dateFromString(a.date_start);
        const aEnd = dateFromString(a.date_end) || aStart;
        const bStart = dateFromString(b.date_start);
        const bEnd = dateFromString(b.date_end) || bStart;

        const aDaysToEnd = aEnd - todayDate;
        const bDaysToEnd = bEnd - todayDate;
        return aDaysToEnd - bDaysToEnd || (aEnd - aStart) - (bEnd - bStart);
      });

      return filtered;
    }

    function getUniqueCities() {
      const cities = new Set(state.allEvents.map(e => e.city).filter(Boolean));
      return Array.from(cities).sort();
    }

    function getUniqueCategories() {
      const cats = new Set(state.allEvents.map(e => e.category).filter(Boolean));
      return Array.from(cats).sort();
    }

    function renderTimeWindows() {
      const timeWindows = [
        { id: 'hoy', label: 'Hoy' },
        { id: 'esta_semana', label: 'Esta semana' },
        { id: 'este_mes', label: 'Este mes' },
        { id: 'proximos', label: 'Próximos' },
      ];

      let html = '<div class="time-window-section">';
      html += '<div class="time-window-search"><input type="text" id="search-input" placeholder="Nombre, lugar, ubicación..." value="' + (state.searchQuery || '') + '"><button class="search-button" id="search-btn" type="button">🔍</button></div>';
      html += '<div class="time-tabs">';
      for (const tw of timeWindows) {
        const active = tw.id === state.timeWindow ? 'active' : '';
        html += `<button class="time-tab ${active}" data-time="${tw.id}">${tw.label}</button>`;
      }
      html += '</div></div>';
      return html;
    }

    function renderControls(cities, categories) {
      let html = '<div class="controls">';
      html += '<div class="control-row">';
      html += '<div><label>Ciudad:</label><br>';
      html += '<select id="city-filter"><option value="" ' + (state.selectedCities.length === 0 ? 'selected' : '') + '>Todas</option>';
      for (const city of cities) {
        const selected = state.selectedCities.includes(city) ? 'selected' : '';
        html += `<option value="${city}" ${selected}>${city.toUpperCase()}</option>`;
      }
      html += '</select></div>';
      html += '</div>';

      if (categories.length > 0) {
        html += '<div class="control-row">';
        html += '<div style="flex: 1;"><div class="categories">';
        for (const cat of categories) {
          const active = state.selectedCategories.includes(cat) ? 'active' : '';
          html += `<button class="category-pill ${active}" data-category="${cat}">${cat}</button>`;
        }
        html += '</div></div>';
        html += '</div>';
      }

      html += '</div>';
      return html;
    }

    function getDateRangeForWindow(windowId) {
      const today = getToday();
      const todayDate = new Date(today.getFullYear(), today.getMonth(), today.getDate());
      const months = ['ene', 'feb', 'mar', 'abr', 'may', 'jun', 'jul', 'ago', 'sep', 'oct', 'nov', 'dic'];

      let startDate, endDate;
      if (windowId === 'hoy') {
        startDate = todayDate;
        endDate = todayDate;
      } else if (windowId === 'esta_semana') {
        startDate = todayDate;
        endDate = new Date(todayDate);
        endDate.setDate(todayDate.getDate() + 6);
      } else if (windowId === 'este_mes') {
        startDate = todayDate;
        endDate = new Date(todayDate);
        endDate.setDate(todayDate.getDate() + 29);
      } else if (windowId === 'proximos') {
        return `${todayDate.getDate()} ${months[todayDate.getMonth()]}+`;
      }

      const formatDateShort = (d) => `${d.getDate()} ${months[d.getMonth()]}`;
      if (startDate.getTime() === endDate.getTime()) {
        return formatDateShort(startDate);
      }
      return `${formatDateShort(startDate)} - ${formatDateShort(endDate)}`;
    }

    function renderResults(filtered, timeWindowLabel, timeWindowId, sectionClass) {
      let html = '';
      const dateRange = getDateRangeForWindow(timeWindowId);
      if (filtered.length === 0) {
        html += `<section class="${sectionClass}"><h2>Sin eventos</h2><p class="empty">No hay eventos que coincidan con los filtros seleccionados</p></section>`;
      } else {
        const cards = filtered.map(renderCard).join('\n');
        html += `<section class="${sectionClass}"><h2>${timeWindowLabel}: ${dateRange} <span class="count">(${filtered.length})</span></h2><div class="grid">${cards}</div></section>`;
      }
      return html;
    }

    function renderMain(fullRender = false) {
      const filtered = getFilteredEvents();
      const cities = getUniqueCities();
      const categories = getUniqueCategories();
      const timeWindows = [
        { id: 'hoy', label: 'Hoy' },
        { id: 'esta_semana', label: 'Esta semana' },
        { id: 'este_mes', label: 'Este mes' },
        { id: 'proximos', label: 'Próximos' },
      ];

      const sectionClass = '';
      const timeWindowLabel = timeWindows.find(tw => tw.id === state.timeWindow)?.label || '';

      let html = '';

      // Always render time windows (they're sticky at top)
      html += renderTimeWindows();

      // Only re-render controls on full render (city/category change)
      if (fullRender) {
        html += renderControls(cities, categories);
      }

      html += renderResults(filtered, timeWindowLabel, state.timeWindow, sectionClass);

      if (fullRender) {
        document.getElementById('main').innerHTML = html;
        attachEventListeners();
      } else {
        // Only update the results section (not time windows - preserves search input focus)
        const resultsContainer = document.querySelector('#main section');
        if (resultsContainer) {
          resultsContainer.outerHTML = renderResults(filtered, timeWindowLabel, state.timeWindow, sectionClass);
        }
      }
    }

    function attachEventListeners() {
      document.querySelectorAll('.time-tab').forEach(btn => {
        btn.addEventListener('click', (e) => {
          state.timeWindow = e.target.dataset.time;
          syncStateToURL();
          renderMain(true);
        });
      });

      const cityFilter = document.getElementById('city-filter');
      if (cityFilter) {
        cityFilter.addEventListener('change', (e) => {
          state.selectedCities = e.target.value ? [e.target.value] : [];
          syncStateToURL();
          renderMain(true);
        });
      }

      document.querySelectorAll('.category-pill').forEach(btn => {
        btn.addEventListener('click', (e) => {
          const cat = e.target.dataset.category;
          // Single-select: if already selected, deselect; otherwise, select only this one
          if (state.selectedCategories.includes(cat)) {
            state.selectedCategories = [];
          } else {
            state.selectedCategories = [cat];
          }
          syncStateToURL();
          renderMain(true);
        });
      });

      const searchInput = document.getElementById('search-input');
      if (searchInput) {
        searchInput.addEventListener('input', (e) => {
          clearTimeout(state.searchTimeout);
          state.searchQuery = e.target.value;
          state.searchTimeout = setTimeout(() => {
            syncStateToURL();
            renderMain(false);
          }, 300);
        });
      }

      const searchBtn = document.getElementById('search-btn');
      if (searchBtn) {
        searchBtn.addEventListener('click', () => {
          searchInput?.focus();
        });
      }
    }

    async function init() {
      try {
        loadStateFromURL();
        const response = await fetch('data/events.json');
        if (!response.ok) {
          throw new Error(`HTTP error: ${response.status}`);
        }
        const data = await response.json();
        state.allEvents = data.events || [];

        if (state.allEvents.length === 0) {
          document.getElementById('main').innerHTML = '<p class="empty">No hay eventos disponibles</p>';
          return;
        }

        renderMain(true);

        const updatedInfo = document.getElementById('updated-info');
        if (data.generated_at) {
          updatedInfo.innerHTML = `Actualizado:<br>${data.generated_at}`;
        }
      } catch (error) {
        console.error('Error loading events:', error);
        document.getElementById('main').innerHTML = `<div class="error">Error al cargar eventos: ${error.message}</div>`;
      }
    }

    document.addEventListener('DOMContentLoaded', init);
  </script>
</body>
</html>
